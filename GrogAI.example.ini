; Grog i klamstwa - AI configuration.
; Copy this file to GrogAI.ini and fill in your API key. Never share GrogAI.ini.

[ai]
provider = anthropic          ; anthropic | openai_compatible
base_url =                     ; empty only for anthropic; required for openai_compatible, e.g.
                               ; https://api.openai.com/v1, https://api.deepseek.com, http://localhost:11434/v1 (see README)
model = claude-sonnet-5-5
api_key =                      ; or environment variable GROGAI_API_KEY
director_model =               ; optional different (cheaper) model for the director
timeout_s = 20
temperature = 0.8
director_interval_s = 240      ; seconds between Game Master calls (>= 30)

[game]
language = pl                  ; pl | en
seed =                         ; empty = random
debug = false

[telemetry]
log_dir = logs
